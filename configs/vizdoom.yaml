environment:
    type: "Vizdoom"
    config: "./venv/lib64/python3.10/site-packages/vizdoom/scenarios/health_gathering.cfg"
    scenario: "./venv/lib64/python3.10/site-packages/vizdoom/scenarios/health_gathering.wad"
    frame_skip: 4
    resolution: "RES_160X120"
gamma: 0.99
lamda: 0.95
updates: 650
epochs: 4
n_workers: 16
worker_steps: 64
n_mini_batch: 3
value_loss_coefficient: 0.25
hidden_layer_size: 256
max_grad_norm: 0.5
recurrence:
    sequence_length: 8
    hidden_state_size: 256
    layer_type: lstm
    reset_hidden_state: False
learning_rate_schedule:
    initial: 2.0e-4
    final: 2.0e-4
    power: 1.0
    max_decay_steps: 300
beta_schedule:
    initial: 0.001
    final: 0.001
    power: 1.0
    max_decay_steps: 300
clip_range_schedule:
    initial: 0.2
    final: 0.2
    power: 1.0
    max_decay_steps: 300
video_every: 10
